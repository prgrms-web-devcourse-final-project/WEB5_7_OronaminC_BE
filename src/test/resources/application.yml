spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
    stack:
      auto: false
    credentials:
      access-key: dummy
      secret-key: dummy