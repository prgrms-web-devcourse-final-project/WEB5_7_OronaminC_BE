name: Pull Request Test Automation
on:
  pull_request:
    branches:
      - dev

jobs:

  code-test:
    name: 코드 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 브랜치로 체크아웃
        uses: actions/checkout@v4

      - name: JDK 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 권한 세팅
        run: chmod +x ./gradlew

      - name: 테스트 수행
        run: ./gradlew test --no-daemon

      - name: Slack 알림 보내기(테스트 실패 시)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ":red_circle: *CI 테스트 실패 알림*\n"
                        + "리포지토리: `${{ github.repository }}`\n"
                        + "브랜치: `${{ github.ref_name }}`\n"
                        + "PR 번호: ${{ github.event.pull_request.number }}\n"
                        + "PR 제목: `${{ github.event.pull_request.title }}`\n"
                        + "워크플로우: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>\n"
                        + "실패 커밋: `${{ github.event.pull_request.head.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
